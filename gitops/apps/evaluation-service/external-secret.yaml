# O External Secrets Operator lê o(s) secret(s) do AWS Secrets Manager e cria o
# Secret "evaluation-service-secret" neste namespace. Cada chave do JSON vira uma variável
# de ambiente do pod. Nenhum valor sensível fica no Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: evaluation-service-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: evaluation-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/evaluation-service
    - extract:
        key: togglemaster/evaluation-service-api-key
