# Todos os serviços compartilham um único ALB (group.name). O ALB encaminha
# /evaluation/... para este serviço removendo o prefixo: /evaluation/health -> /health.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evaluation-service
  annotations:
    alb.ingress.kubernetes.io/group.name: togglemaster
    alb.ingress.kubernetes.io/group.order: "40"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/transforms.evaluation-service: >-
      [{"type":"url-rewrite","urlRewriteConfig":{"rewrites":[{"regex":"^/evaluation/?(.*)$","replace":"/$1"}]}}]
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /evaluation
            pathType: Prefix
            backend:
              service:
                name: evaluation-service
                port:
                  number: 8004
