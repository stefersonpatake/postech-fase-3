apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  # Sem "replicas": a quantidade de pods é controlada pelo HPA (hpa.yaml).
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          # Nome lógico: registry e tag são resolvidos em kustomization.yaml (images).
          image: analytics-service
          ports:
            - containerPort: 8005
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: analytics-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 20
            periodSeconds: 20
