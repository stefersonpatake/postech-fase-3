# Todos os serviços compartilham um único ALB (group.name). O ALB encaminha
# /analytics/... para este serviço removendo o prefixo: /analytics/health -> /health.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics-service
  annotations:
    alb.ingress.kubernetes.io/group.name: togglemaster
    alb.ingress.kubernetes.io/group.order: "50"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/transforms.analytics-service: >-
      [{"type":"url-rewrite","urlRewriteConfig":{"rewrites":[{"regex":"^/analytics/?(.*)$","replace":"/$1"}]}}]
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /analytics
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 8005
