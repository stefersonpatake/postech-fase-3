sonar.organization=stefersonpatake
sonar.projectKey=stefersonpatake_postech-fase-3
sonar.projectName=postech-fase-3

# Código dos 5 microsserviços
sonar.sources=auth-service,flag-service,targeting-service,evaluation-service,analytics-service
sonar.tests=auth-service,flag-service,targeting-service,evaluation-service,analytics-service
sonar.test.inclusions=**/*_test.go,**/tests/**
sonar.exclusions=**/*_test.go,**/tests/**,**/db/**

sonar.python.version=3.11

# A cobertura é medida no CI de cada serviço (go test -cover / pytest), não no Sonar.
# Sem relatório de cobertura o Sonar assumiria 0% e reprovaria o quality gate.
sonar.coverage.exclusions=**/*
