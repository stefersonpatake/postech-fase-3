# Pipeline reutilizável dos microsserviços em Go (auth-service, evaluation-service).
# Estágios: Build & Test -> Lint -> Security (SCA + SAST) -> Docker (build, scan, push).
name: CI Go (reutilizável)

on:
  workflow_call:
    inputs:
      service:
        description: "Pasta do microsserviço, por exemplo auth-service"
        required: true
        type: string
    outputs:
      image_tag:
        description: Tag da imagem enviada ao ECR (vazio se não houve push)
        value: ${{ jobs.docker.outputs.image_tag }}

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0
  GOSEC_VERSION: v2.29.0

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ inputs.service }}/go.sum

      - name: Build
        run: go build ./...

      - name: Testes unitários
        run: go test -race -cover ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ inputs.service }}/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ inputs.service }}

  security:
    name: Security Scan (SCA + SAST)
    runs-on: ubuntu-latest
    needs: [build-test, lint]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ inputs.service }}/go.sum

      # ── SCA: vulnerabilidades nas dependências (go.mod) ──
      - name: SCA - Trivy fs (relatório HIGH e CRITICAL)
        run: |
          docker run --rm -v "$PWD/${{ inputs.service }}:/src:ro" "$TRIVY_IMAGE" \
            fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 /src

      - name: SCA - Trivy fs (bloqueia se houver CRITICAL)
        run: |
          docker run --rm -v "$PWD/${{ inputs.service }}:/src:ro" "$TRIVY_IMAGE" \
            fs --scanners vuln --severity CRITICAL --exit-code 1 /src

      # ── SAST: vulnerabilidades no código-fonte ──
      - name: Instalar gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: SAST - gosec (relatório completo)
        working-directory: ${{ inputs.service }}
        run: gosec -no-fail -exclude-generated ./...

      # O gosec classifica em LOW/MEDIUM/HIGH; HIGH é o nível máximo da ferramenta
      # e é tratado como "crítico" na regra de bloqueio.
      - name: SAST - gosec (bloqueia se houver severidade HIGH)
        working-directory: ${{ inputs.service }}
        run: gosec -quiet -severity high -exclude-generated ./...

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: security
    outputs:
      image_tag: ${{ steps.push.outputs.image_tag }}
    env:
      LOCAL_IMAGE: ${{ inputs.service }}:ci
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build -t "$LOCAL_IMAGE" "${{ inputs.service }}"

      - name: Container scan - Trivy image (relatório HIGH e CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$LOCAL_IMAGE"

      - name: Container scan - Trivy image (bloqueia se houver CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$LOCAL_IMAGE"

      # Daqui em diante só em push na main: Pull Requests constroem e escaneiam, mas não publicam.
      - name: Credenciais AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push para o ECR (tag = v1.0.0-<hash do commit>)
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="v1.0.0-${GITHUB_SHA::7}"
          IMAGE="$REGISTRY/togglemaster/${{ inputs.service }}:$TAG"
          docker tag "$LOCAL_IMAGE" "$IMAGE"
          docker push "$IMAGE"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Imagem publicada: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
