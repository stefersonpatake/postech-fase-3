# Pipeline reutilizável dos microsserviços em Python (flag, targeting, analytics).
# Estágios: Build & Test -> Lint -> Security (SCA + SAST) -> Docker (build, scan, push)
# -> GitOps (atualiza a tag da imagem em gitops/).
name: CI Python (reutilizável)

on:
  workflow_call:
    inputs:
      service:
        description: "Pasta do microsserviço, por exemplo flag-service"
        required: true
        type: string
    outputs:
      image_tag:
        description: Tag da imagem enviada ao ECR (vazio se não houve push)
        value: ${{ jobs.docker.outputs.image_tag }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.74.0

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ inputs.service }}/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build (compilação dos módulos)
        run: python -m compileall -q app.py

      - name: Testes unitários
        run: python -m pytest -v

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ inputs.service }}/requirements*.txt

      - name: Instalar ferramentas
        run: pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 . --count --show-source --statistics

  security:
    name: Security Scan (SCA + SAST)
    runs-on: ubuntu-latest
    needs: [build-test, lint]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ inputs.service }}/requirements*.txt

      # ── SCA: vulnerabilidades nas dependências (requirements.txt) ──
      - name: SCA - Trivy fs (relatório HIGH e CRITICAL)
        run: |
          docker run --rm -v "$PWD/${{ inputs.service }}:/src:ro" "$TRIVY_IMAGE" \
            fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 /src

      - name: SCA - Trivy fs (bloqueia se houver CRITICAL)
        run: |
          docker run --rm -v "$PWD/${{ inputs.service }}:/src:ro" "$TRIVY_IMAGE" \
            fs --scanners vuln --severity CRITICAL --exit-code 1 /src

      # ── SAST: vulnerabilidades no código-fonte ──
      - name: Instalar bandit
        working-directory: ${{ inputs.service }}
        run: pip install -r requirements-dev.txt

      - name: SAST - bandit (relatório completo)
        working-directory: ${{ inputs.service }}
        run: bandit -r . -x ./tests --exit-zero

      # O bandit classifica em LOW/MEDIUM/HIGH; HIGH é o nível máximo da ferramenta
      # e é tratado como "crítico" na regra de bloqueio.
      - name: SAST - bandit (bloqueia se houver severidade HIGH)
        working-directory: ${{ inputs.service }}
        run: bandit -q -r . -x ./tests --severity-level high

  docker:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: security
    outputs:
      image_tag: ${{ steps.push.outputs.image_tag }}
    env:
      LOCAL_IMAGE: ${{ inputs.service }}:ci
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build -t "$LOCAL_IMAGE" "${{ inputs.service }}"

      - name: Container scan - Trivy image (relatório HIGH e CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$LOCAL_IMAGE"

      - name: Container scan - Trivy image (bloqueia se houver CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$LOCAL_IMAGE"

      # Daqui em diante só na main (push ou execução manual): Pull Requests constroem e escaneiam, mas não publicam.
      - name: Credenciais AWS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push para o ECR (tag = v1.0.0-<hash do commit>)
        id: push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG="v1.0.0-${GITHUB_SHA::7}"
          REPOSITORY="togglemaster/${{ inputs.service }}"
          IMAGE="$REGISTRY/$REPOSITORY:$TAG"

          # As tags são imutáveis no ECR: ao reexecutar o pipeline do mesmo commit,
          # a imagem já existe e o push é pulado.
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Imagem $IMAGE já existe no ECR; push ignorado."
          else
            docker tag "$LOCAL_IMAGE" "$IMAGE"
            docker push "$IMAGE"
          fi

          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Imagem publicada: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  # Entrega contínua via GitOps: o CI não aplica nada no cluster. Ele só registra no
  # Git qual imagem deve estar rodando; o ArgoCD detecta o commit e sincroniza.
  gitops:
    name: GitOps - atualizar tag da imagem
    runs-on: ubuntu-latest
    needs: docker
    if: needs.docker.outputs.image_tag != ''
    permissions:
      contents: write
    env:
      SERVICE: ${{ inputs.service }}
      TAG: ${{ needs.docker.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Atualizar newTag em gitops/apps/${{ inputs.service }}/kustomization.yaml
        run: |
          FILE="gitops/apps/$SERVICE/kustomization.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Vários serviços podem terminar ao mesmo tempo e disputar o push na main.
          # A cada tentativa: parte do estado mais recente da main, altera e envia.
          for attempt in 1 2 3 4 5 6; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            sed -i -E "s|^([[:space:]]*newTag:).*|\1 $TAG|" "$FILE"

            if git diff --quiet; then
              echo "$FILE já está em $TAG; nada a fazer."
              exit 0
            fi

            git commit --quiet -am "gitops($SERVICE): imagem $TAG"
            if git push --quiet origin HEAD:main; then
              echo "### GitOps: \`$SERVICE\` → \`$TAG\` ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Push rejeitado (a main avançou). Tentativa $attempt de 6..."
            sleep $((attempt * 4))
          done

          echo "Não foi possível atualizar $FILE após 6 tentativas."
          exit 1
