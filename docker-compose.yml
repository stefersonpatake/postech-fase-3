services:
  # --- Infra: Postgres (2 instâncias), Redis, DynamoDB Local ---

  postgres-auth:
    image: postgres:13
    environment:
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=dev@321#
      - POSTGRES_DB=auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Compartilhado por flag-service (db 'flagapi') e targeting-service
  # (db 'targeting_db', criado por postgres-flags-init/01-create-targeting-db.sql)
  postgres-flags:
    image: postgres:13
    environment:
      - POSTGRES_USER=flagapi_user
      - POSTGRES_PASSWORD=dev@321#
      - POSTGRES_DB=flagapi
    ports:
      - "5432:5432"
    volumes:
      - flags_postgres_data:/var/lib/postgresql/data/
      - ./postgres-flags-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagapi_user -d flagapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  # Job one-shot: cria a tabela ToggleMasterAnalytics no DynamoDB Local
  # (ele sobe vazio e o analytics-service não cria a tabela sozinho).
  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      - dynamodb-local
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 --region us-east-1 >/dev/null 2>&1;
        do echo "Aguardando DynamoDB Local..."; sleep 1; done;
        aws dynamodb create-table
        --table-name ToggleMasterAnalytics
        --attribute-definitions AttributeName=event_id,AttributeType=S
        --key-schema AttributeName=event_id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST
        --endpoint-url http://dynamodb-local:8000
        --region us-east-1
        || true
    restart: "no"

  # --- Microsserviços ---

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DB_HOST=postgres-auth
      - DB_PORT=5432
      - DB_USER=auth_user
      - DB_PASSWORD=dev@321#
      - DB_NAME=auth_db
      - DATABASE_URL=host=postgres-auth port=5432 dbname=auth_db user=auth_user password=dev@321#
      - MASTER_KEY=admin-secreto-123
    depends_on:
      postgres-auth:
        condition: service_healthy

  flag-service:
    build: ./flag-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DB_HOST=postgres-flags
      - DB_PORT=5432
      - DB_USER=flagapi_user
      - DB_PASSWORD=dev@321#
      - DB_NAME=flagapi
      - DATABASE_URL=host=postgres-flags port=5432 dbname=flagapi user=flagapi_user password=dev@321#
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      postgres-flags:
        condition: service_healthy
      auth-service:
        condition: service_started

  targeting-service:
    build: ./targeting-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - DB_HOST=postgres-flags
      - DB_PORT=5432
      - DB_USER=flagapi_user
      - DB_PASSWORD=dev@321#
      - DB_NAME=targeting_db
      - DATABASE_URL=host=postgres-flags port=5432 dbname=targeting_db user=flagapi_user password=dev@321#
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      postgres-flags:
        condition: service_healthy
      auth-service:
        condition: service_started

  evaluation-service:
    build: ./evaluation-service
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - REDIS_URL=redis://redis:6379
      - FLAG_SERVICE_URL=http://flag-service:8002
      - TARGETING_SERVICE_URL=http://targeting-service:8003
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - AWS_SQS_URL=${AWS_SQS_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started

  analytics-service:
    build: ./analytics-service
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_SQS_URL=${AWS_SQS_URL}
      - AWS_DYNAMODB_TABLE=${AWS_DYNAMODB_TABLE:-ToggleMasterAnalytics}
      # Aponta para o DynamoDB Local do compose em vez do DynamoDB real da AWS.
      - AWS_DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

volumes:
  auth_postgres_data:
  flags_postgres_data:
