# auto-refresh-credentials.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: credentials-refresher
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: credentials-refresher
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: credentials-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: credentials-refresher
subjects:
- kind: ServiceAccount
  name: credentials-refresher
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: refresh-script
  namespace: kube-system
data:
  refresh.sh: |
    #!/bin/sh
    set -e

    # Ler credenciais do arquivo montado
    ACCESS_KEY=$(grep aws_access_key_id /aws-credentials/credentials | awk '{print $3}')
    SECRET_KEY=$(grep aws_secret_access_key /aws-credentials/credentials | awk '{print $3}')
    SESSION_TOKEN=$(grep aws_session_token /aws-credentials/credentials | awk '{print $3}')

    # Atualizar o secret
    kubectl create secret generic aws-credentials \
      --from-literal=AWS_ACCESS_KEY_ID="$ACCESS_KEY" \
      --from-literal=AWS_SECRET_ACCESS_KEY="$SECRET_KEY" \
      --from-literal=AWS_SESSION_TOKEN="$SESSION_TOKEN" \
      -n kube-system \
      --dry-run=client -o yaml | kubectl apply -f -

    # Reiniciar o controller
    kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system
    echo "✅ Credenciais atualizadas com sucesso!"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: credentials-refresher
  namespace: kube-system
spec:
  schedule: "*/30 * * * *"  # A cada 30 minutos
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: credentials-refresher
          containers:
          - name: refresher
            image: bitnami/kubectl:latest
            command: ["/bin/sh", "/scripts/refresh.sh"]
            volumeMounts:
            - name: aws-credentials
              mountPath: /aws-credentials
            - name: scripts
              mountPath: /scripts
          volumes:
          - name: aws-credentials
            secret:
              secretName: aws-credentials-file  # Secret com seu arquivo credentials
          - name: scripts
            configMap:
              name: refresh-script
              defaultMode: 0755
          restartPolicy: OnFailure
