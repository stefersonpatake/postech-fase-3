# 06-autorefreshcredentials.yaml (corrigido)
#
# PROBLEMA ORIGINAL: o CronJob só atualizava o Secret "aws-credentials" no
# namespace kube-system (usado para reiniciar o aws-load-balancer-controller).
# Só que targeting-service e analytics-service usam suas PRÓPRIAS cópias fixas
# de AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN, dentro de
# targeting-service-secret e analytics-service-secret (namespaces "targeting" e
# "analytics"). Secrets são objetos por namespace, então essas cópias nunca eram
# atualizadas - quando a sessão do AWS Academy Lab expira, esses dois serviços
# passam a receber ExpiredTokenException mesmo com o CronJob rodando.
#
# CORREÇÃO: o script agora também faz "kubectl patch" (merge, só nas chaves
# AWS_*) em targeting-service-secret e analytics-service-secret, preservando as
# chaves de banco (DB_HOST, DB_USER, DB_PASS, DATABASE_URL) que já estão nesses
# secrets. Depois reinicia os 3 Deployments que dependem de credenciais AWS, já
# que alterar um Secret não atualiza sozinho as env vars de pods já em execução.
#
# PRÉ-REQUISITO MANUAL (fora deste arquivo, e que precisa ser refeito a cada
# nova sessão do AWS Academy Lab, pois o token expira com a sessão):
#   kubectl create secret generic aws-credentials-file \
#     --from-file=credentials=$HOME/.aws/credentials \
#     -n kube-system --dry-run=client -o yaml | kubectl apply -f -
# Sem isso, o CronJob falha porque o Secret que ele monta em /aws-credentials
# não existe.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: credentials-refresher
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: credentials-refresher
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: credentials-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: credentials-refresher
subjects:
- kind: ServiceAccount
  name: credentials-refresher
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: refresh-script
  namespace: kube-system
data:
  refresh.sh: |
    #!/bin/sh
    set -e

    # Ler credenciais do arquivo montado (fonte: secret aws-credentials-file)
    ACCESS_KEY=$(grep aws_access_key_id /aws-credentials/credentials | awk '{print $3}')
    SECRET_KEY=$(grep aws_secret_access_key /aws-credentials/credentials | awk '{print $3}')
    SESSION_TOKEN=$(grep aws_session_token /aws-credentials/credentials | awk '{print $3}')

    # 1) Secret dedicado do kube-system (usado pelo aws-load-balancer-controller)
    kubectl create secret generic aws-credentials \
      --from-literal=AWS_ACCESS_KEY_ID="$ACCESS_KEY" \
      --from-literal=AWS_SECRET_ACCESS_KEY="$SECRET_KEY" \
      --from-literal=AWS_SESSION_TOKEN="$SESSION_TOKEN" \
      -n kube-system \
      --dry-run=client -o yaml | kubectl apply -f -

    # 2) targeting-service-secret: merge só das chaves AWS_*, sem mexer nas
    #    chaves de banco (DB_HOST, DB_USER, DB_PASS, DATABASE_URL) já existentes
    kubectl patch secret targeting-service-secret -n targeting \
      --type merge \
      -p "{\"stringData\":{\"AWS_ACCESS_KEY_ID\":\"$ACCESS_KEY\",\"AWS_SECRET_ACCESS_KEY\":\"$SECRET_KEY\",\"AWS_SESSION_TOKEN\":\"$SESSION_TOKEN\"}}"

    # 3) analytics-service-secret: idem
    kubectl patch secret analytics-service-secret -n analytics \
      --type merge \
      -p "{\"stringData\":{\"AWS_ACCESS_KEY_ID\":\"$ACCESS_KEY\",\"AWS_SECRET_ACCESS_KEY\":\"$SECRET_KEY\",\"AWS_SESSION_TOKEN\":\"$SESSION_TOKEN\"}}"

    # Reiniciar os deployments que consomem credenciais AWS, para que os pods
    # já em execução leiam os valores novos (env vars não são recarregadas
    # sozinhas quando o Secret muda)
    kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system
    kubectl rollout restart deployment/targeting-service -n targeting
    kubectl rollout restart deployment/analytics-service -n analytics

    echo "✅ Credenciais atualizadas com sucesso (kube-system, targeting, analytics)!"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: credentials-refresher
  namespace: kube-system
spec:
  schedule: "*/30 * * * *"  # A cada 30 minutos
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: credentials-refresher
          containers:
          - name: refresher
            image: bitnami/kubectl:latest
            command: ["/bin/sh", "/scripts/refresh.sh"]
            volumeMounts:
            - name: aws-credentials
              mountPath: /aws-credentials
            - name: scripts
              mountPath: /scripts
          volumes:
          - name: aws-credentials
            secret:
              secretName: aws-credentials-file  # Secret com seu arquivo credentials (bootstrap manual, ver comentário no topo)
          - name: scripts
            configMap:
              name: refresh-script
              defaultMode: 0755
          restartPolicy: OnFailure