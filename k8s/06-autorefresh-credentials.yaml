apiVersion: v1
kind: ServiceAccount
metadata:
  name: credentials-refresher
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: credentials-refresher
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: credentials-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: credentials-refresher
subjects:
- kind: ServiceAccount
  name: credentials-refresher
  namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: refresh-script
  namespace: kube-system
data:
  refresh.sh: |
    #!/bin/sh
    set -e

    CRED_FILE=/aws-credentials/credentials

    # Extrai "chave = valor" OU "chave=valor" (com ou sem espaço), removendo
    # \r (arquivos salvos em CRLF) e espaços residuais.
    extract() {
      grep "^$1" "$CRED_FILE" | head -n1 | sed -E 's/^[^=]*=[[:space:]]*//' | tr -d '[:space:]'
    }

    ACCESS_KEY=$(extract aws_access_key_id)
    SECRET_KEY=$(extract aws_secret_access_key)
    SESSION_TOKEN=$(extract aws_session_token)

    # Falha alto e claro em vez de gravar credenciais vazias silenciosamente
    if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ] || [ -z "$SESSION_TOKEN" ]; then
      echo "❌ Falha ao extrair credenciais de $CRED_FILE - verifique o formato do arquivo (secret aws-credentials-file)." >&2
      exit 1
    fi

    # 1) Secret dedicado do kube-system (usado pelo aws-load-balancer-controller)
    kubectl create secret generic aws-credentials \
      --from-literal=AWS_ACCESS_KEY_ID="$ACCESS_KEY" \
      --from-literal=AWS_SECRET_ACCESS_KEY="$SECRET_KEY" \
      --from-literal=AWS_SESSION_TOKEN="$SESSION_TOKEN" \
      -n kube-system \
      --dry-run=client -o yaml | kubectl apply -f -

    # 2) targeting-service-secret: merge só das chaves AWS_*, sem mexer nas
    #    chaves de banco (DB_HOST, DB_USER, DB_PASS, DATABASE_URL) já existentes
    kubectl patch secret targeting-service-secret -n targeting \
      --type merge \
      -p "{\"stringData\":{\"AWS_ACCESS_KEY_ID\":\"$ACCESS_KEY\",\"AWS_SECRET_ACCESS_KEY\":\"$SECRET_KEY\",\"AWS_SESSION_TOKEN\":\"$SESSION_TOKEN\"}}"

    # 3) analytics-service-secret: idem
    kubectl patch secret analytics-service-secret -n analytics \
      --type merge \
      -p "{\"stringData\":{\"AWS_ACCESS_KEY_ID\":\"$ACCESS_KEY\",\"AWS_SECRET_ACCESS_KEY\":\"$SECRET_KEY\",\"AWS_SESSION_TOKEN\":\"$SESSION_TOKEN\"}}"

    # Reiniciar os deployments que consomem credenciais AWS, para que os pods
    # já em execução leiam os valores novos (env vars não são recarregadas
    # sozinhas quando o Secret muda)
    kubectl rollout restart deployment/aws-load-balancer-controller -n kube-system
    kubectl rollout restart deployment/targeting-service -n targeting
    kubectl rollout restart deployment/analytics-service -n analytics

    echo "✅ Credenciais atualizadas com sucesso (kube-system, targeting, analytics)!"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: credentials-refresher
  namespace: kube-system
spec:
  schedule: "*/30 * * * *"  # A cada 30 minutos
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: credentials-refresher
          containers:
          - name: refresher
            image: bitnami/kubectl:latest
            command: ["/bin/sh", "/scripts/refresh.sh"]
            volumeMounts:
            - name: aws-credentials
              mountPath: /aws-credentials
            - name: scripts
              mountPath: /scripts
          volumes:
          - name: aws-credentials
            secret:
              secretName: aws-credentials-file  # Secret com seu arquivo credentials (bootstrap manual, ver comentário no topo)
          - name: scripts
            configMap:
              name: refresh-script
              defaultMode: 0755
          restartPolicy: OnFailure