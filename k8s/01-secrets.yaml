# ─── AUTH SERVICE ───────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: auth
type: Opaque
data:
  DATABASE_URL: # base64 encoded value
  DB_HOST: # base64 encoded value
  DB_USER: # base64 encoded value
  DB_PASS: # base64 encoded value
  JWT_SECRET: # base64 encoded value
  MASTER_KEY: # base64 encoded value
---
# ─── FLAG SERVICE ────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: flag-service-secret
  namespace: flags
type: Opaque
data:
  DB_HOST: # base64 encoded value
  DB_USER: # base64 encoded value
  DB_PASS: # base64 encoded value
  DATABASE_URL: # base64 encoded value
---
# ─── TARGETING SERVICE ───────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: targeting-service-secret
  namespace: targeting
type: Opaque
data:
  DATABASE_URL: # base64 encoded value
  DB_HOST: # base64 encoded value
  DB_USER: # base64 encoded value
  DB_PASS: # base64 encoded value
  AWS_ACCESS_KEY_ID: # base64 encoded value
  AWS_SECRET_ACCESS_KEY: # base64 encoded value
  AWS_SESSION_TOKEN: # base64 encoded value
---
# ─── EVALUATION SERVICE ──────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: evaluation-service-secret
  namespace: evaluation
type: Opaque
data:
  REDIS_URL: # base64 encoded value
---
# ─── ANALYTICS SERVICE ───────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: analytics-service-secret
  namespace: analytics
type: Opaque
data:
  AWS_ACCESS_KEY_ID: # base64 encoded value
  AWS_SECRET_ACCESS_KEY: # base64 encoded value
  AWS_SESSION_TOKEN: # base64 encoded value
  AWS_SQS_URL: # base64 encoded value