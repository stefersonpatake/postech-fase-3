# Aponta o External Secrets Operator para o AWS Secrets Manager.
# Sem bloco "auth": o ESO usa a cadeia padrão de credenciais, que no cluster
# resolve para a role do nó (LabRole) via IMDS.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
